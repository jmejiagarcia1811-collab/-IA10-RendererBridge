name: IA10 Queue Circuit Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

jobs:
  queue-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Detect blocked intake and editorial backlog
        env:
          HEALTH_URL: https://ia10-renderer-bridge.onrender.com/health
          PENDING_REVIEW_LIMIT: "25"
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request
          url = os.environ["HEALTH_URL"]
          last_error = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "IA10-Queue-Watchdog"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError(f"health_http_{response.status}")
                      data = json.loads(response.read().decode("utf-8"))
                  if data.get("status") != "alive" or data.get("database_ok") is not True:
                      raise RuntimeError("bridge_or_database_unhealthy")
                  counts = data.get("queue_counts") or {}
                  counts = {str(k): int(v) for k, v in counts.items() if isinstance(v, (int, float))}
                  queued = counts.get("QUEUED", 0)
                  pending = counts.get("QC_PENDING_REVIEW", 0)
                  failed = counts.get("FAILED", 0)
                  qc_failed = counts.get("QC_FAILED", 0)
                  snapshot = {"queue_counts": counts, "queued": queued, "qc_pending_review": pending,
                              "failed": failed, "qc_failed": qc_failed,
                              "pending_review_limit": int(os.environ["PENDING_REVIEW_LIMIT"])}
                  print("IA10_QUEUE_SNAPSHOT " + json.dumps(snapshot, sort_keys=True))
                  if pending > int(os.environ["PENDING_REVIEW_LIMIT"]) and queued == 0:
                      sys.exit("QUEUE_CIRCUIT_BLOCKED: editorial backlog exceeds configured limit while intake queue is empty; do not bulk-requeue or auto-approve.")
                  print("PASS: no detected backlog-plus-empty-queue condition.")
                  sys.exit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last_error = f"{type(exc).__name__}:{exc}"
                  print(f"Attempt {attempt + 1}/3 failed: {last_error}")
                  if attempt < 2:
                      time.sleep(10)
          sys.exit("WATCHDOG_UNAVAILABLE: " + str(last_error))
          PY
