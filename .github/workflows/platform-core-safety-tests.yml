name: Platform Core Safety Tests

on:
  pull_request:
    paths:
      - "platform_core.py"
      - "tests/test_platform_core_safety_gates.py"
      - ".github/workflows/platform-core-safety-tests.yml"
  push:
    branches:
      - main
    paths:
      - "platform_core.py"
      - "tests/test_platform_core_safety_gates.py"
      - ".github/workflows/platform-core-safety-tests.yml"

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safety-gate regression tests
        run: python -m unittest discover -s tests -v
