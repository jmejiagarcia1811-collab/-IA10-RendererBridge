name: OIDC audit auth unit tests

on:
  pull_request:
    paths:
      - "github_oidc_auth.py"
      - "tests/test_github_oidc_auth.py"
      - ".github/workflows/oidc-auth-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "github_oidc_auth.py"
      - "tests/test_github_oidc_auth.py"
      - ".github/workflows/oidc-auth-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auth dependency
        run: python -m pip install "PyJWT[crypto]>=2.9,<3"
      - name: Run OIDC fail-closed tests
        run: python -m unittest discover -s tests -p 'test_github_oidc_auth.py' -v
