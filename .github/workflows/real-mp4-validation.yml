name: IA10 Real MP4 Technical Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/real-mp4-validation.yml"
      - "local_renderer.py"
      - "app.py"
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

jobs:
  validate-rendered-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and validate the live rendered MP4
        run: |
          python -m pip install --disable-pip-version-check "imageio-ffmpeg>=0.5.1,<1"
          python - <<'PY'
          import json, os, re, subprocess, sys, time, urllib.request
          url = "https://ia10-renderer-bridge.onrender.com/media/local-23.mp4"
          path = "/tmp/ia10-local-23.mp4"
          last_error = None
          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "IA10-Real-MP4-Validation"})
                  with urllib.request.urlopen(request, timeout=180) as response:
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}")
                      content_type = response.headers.get("Content-Type", "")
                      data = response.read()
                  if not content_type.lower().startswith("video/mp4"):
                      raise RuntimeError(f"Unexpected content type: {content_type}")
                  if len(data) < 1024 or b"ftyp" not in data[:64]:
                      raise RuntimeError("Payload is empty, truncated, or lacks MP4 signature")
                  with open(path, "wb") as handle:
                      handle.write(data)
                  import imageio_ffmpeg
                  ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
                  probe = subprocess.run([ffmpeg, "-hide_banner", "-i", path], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=45)
                  report = probe.stderr
                  video = re.search(r"Video:.*?(\d{2,5})x(\d{2,5})", report, re.S)
                  audio = re.search(r"Audio:", report)
                  duration_match = re.search(r"Duration: (\d+):(\d+):(\d+(?:\.\d+)?)", report)
                  if not video:
                      raise RuntimeError("Video stream/dimensions not detected")
                  width, height = map(int, video.groups())
                  if (width, height) != (1080, 1920):
                      raise RuntimeError(f"Expected 1080x1920; got {width}x{height}")
                  if not audio:
                      raise RuntimeError("No audio stream detected; refusing to mark narrated video as technically valid")
                  if not duration_match:
                      raise RuntimeError("Duration not detected")
                  hours, minutes, seconds = duration_match.groups()
                  duration = int(hours) * 3600 + int(minutes) * 60 + float(seconds)
                  if not 1 <= duration <= 15.5:
                      raise RuntimeError(f"Duration outside 1-15.5s policy: {duration:.2f}s")
                  decoded = subprocess.run([ffmpeg, "-v", "error", "-i", path, "-f", "null", "-"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
                  if decoded.returncode != 0 or decoded.stderr.strip():
                      raise RuntimeError("Full FFmpeg decode failed: " + decoded.stderr[-1000:])
                  print(f"PASS: bytes={len(data)}; content_type={content_type}; resolution={width}x{height}; duration={duration:.2f}s; audio_stream=present; full_decode=passed")
                  print("SCOPE: validates the live local-23 sample only; does not approve editorial content or authorize publication.")
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt + 1}/3 failed: {type(exc).__name__}: {exc}")
                  if attempt < 2:
                      time.sleep(10)
          sys.exit(f"FAIL: rendered MP4 validation did not pass: {last_error}")
          PY
