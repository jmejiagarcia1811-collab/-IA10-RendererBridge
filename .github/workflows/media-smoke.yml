name: IA10 Diagnostic MP4 Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/media-smoke.yml"
      - "app.py"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

jobs:
  validate-mp4:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and validate the live diagnostic MP4
        run: |
          python -m pip install --disable-pip-version-check "imageio-ffmpeg>=0.5.1,<1"
          python - <<'PY'
          import os, re, subprocess, sys, time, urllib.error, urllib.request
          url = "https://ia10-renderer-bridge.onrender.com/media/ia10-test-1.mp4"
          path = "/tmp/ia10-test-1.mp4"
          last_error = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "IA10-MP4-Smoke-Test"})
                  with urllib.request.urlopen(req, timeout=120) as response:
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}")
                      data = response.read()
                      content_type = response.headers.get("Content-Type", "")
                  if len(data) < 10000:
                      raise RuntimeError(f"MP4 too small: {len(data)} bytes")
                  if b"ftyp" not in data[:64]:
                      raise RuntimeError("Missing MP4 ftyp signature")
                  with open(path, "wb") as f:
                      f.write(data)
                  import imageio_ffmpeg
                  ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
                  probe = subprocess.run([ffmpeg, "-hide_banner", "-i", path], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
                  report = probe.stderr
                  if "Video:" not in report:
                      raise RuntimeError("No decodable video stream reported by FFmpeg: " + report[-1200:])
                  if not re.search(r"1080x1920", report):
                      raise RuntimeError("Expected 1080x1920 vertical video; probe output: " + report[-1200:])
                  decoded = subprocess.run([ffmpeg, "-v", "error", "-i", path, "-f", "null", "-"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
                  if decoded.returncode != 0 or decoded.stderr.strip():
                      raise RuntimeError("FFmpeg decode check failed: " + decoded.stderr[-1200:])
                  print(f"PASS: diagnostic MP4 downloaded; bytes={len(data)}; content_type={content_type}; resolution=1080x1920; FFmpeg decode succeeded.")
                  print("LIMIT: this validates only the diagnostic sample, not a Shotstack production render, editorial QC, or publication.")
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt + 1}/3 failed: {exc}")
                  if attempt < 2:
                      time.sleep(10)
          sys.exit(f"FAIL: live MP4 smoke test did not pass: {last_error}")
          PY

  validate-local-23:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request and measure local-23 recovery endpoint
        run: |
          python - <<'PY'
          import sys, urllib.error, urllib.request
          url = "https://ia10-renderer-bridge.onrender.com/media/local-23.mp4"
          request = urllib.request.Request(
              url,
              headers={"Cache-Control": "no-cache", "User-Agent": "IA10-local23-recovery-check"},
          )
          status = None
          content_type = ""
          content_length_header = ""
          size_bytes = 0
          prefix = bytearray()
          try:
              with urllib.request.urlopen(request, timeout=450) as response:
                  status = response.status
                  content_type = response.headers.get("Content-Type", "")
                  content_length_header = response.headers.get("Content-Length", "")
                  while True:
                      chunk = response.read(65536)
                      if not chunk:
                          break
                      size_bytes += len(chunk)
                      if len(prefix) < 64:
                          prefix.extend(chunk[:64 - len(prefix)])
          except urllib.error.HTTPError as exc:
              status = exc.code
              content_type = exc.headers.get("Content-Type", "")
              content_length_header = exc.headers.get("Content-Length", "")
              body = exc.read()
              size_bytes = len(body)
              prefix.extend(body[:64])
          except Exception as exc:
              print(f"HTTP_STATUS={status if status is not None else 'NO_RESPONSE'}")
              print(f"CONTENT_TYPE={content_type or 'unknown'}")
              print(f"CONTENT_LENGTH_HEADER={content_length_header or 'unknown'}")
              print(f"SIZE_BYTES_READ={size_bytes}")
              print(f"ERROR_TYPE={type(exc).__name__}")
              sys.exit(2)
          print(f"HTTP_STATUS={status}")
          print(f"CONTENT_TYPE={content_type or 'missing'}")
          print(f"CONTENT_LENGTH_HEADER={content_length_header or 'missing'}")
          print(f"SIZE_BYTES={size_bytes}")
          print(f"MP4_FTYP_SIGNATURE={'present' if b'ftyp' in prefix else 'missing'}")
          if status != 200:
              sys.exit("FAIL: local-23 endpoint did not return HTTP 200")
          if not content_type.lower().startswith("video/mp4"):
              sys.exit("FAIL: local-23 response is not video/mp4")
          if size_bytes < 1024 or b"ftyp" not in prefix:
              sys.exit("FAIL: local-23 response is empty, truncated, or not an MP4 payload")
          print("PASS: live local-23 transport/MP4 smoke test only; no editorial approval or publication.")
          PY
