name: IA 3.0 database health
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render health and PostgreSQL mode
        env:
          HEALTH_URL: https://ia10-renderer-bridge.onrender.com/health
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          url = os.environ["HEALTH_URL"]
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "IA10-health-monitor/1.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  print(json.dumps({
                      "http_status": response.status,
                      "service": payload.get("service"),
                      "status": payload.get("status"),
                      "database_mode": payload.get("database_mode"),
                      "database_ok": payload.get("database_ok"),
                      "render_configured": payload.get("render_configured"),
                      "auth_configured": payload.get("auth_configured"),
                      "queue_counts": payload.get("queue_counts", {})
                  }, ensure_ascii=False))
                  if response.status != 200 or payload.get("database_ok") is not True:
                      sys.exit("FAIL: service/database health check failed")
                  if payload.get("database_mode") != "postgres":
                      sys.exit("FAIL: service is using ephemeral SQLite, not PostgreSQL")
          except urllib.error.HTTPError as exc:
              print("FAIL: health endpoint returned HTTP", exc.code)
              sys.exit(1)
          except Exception as exc:
              print("FAIL: health check could not complete:", type(exc).__name__, str(exc)[:180])
              sys.exit(1)
          PY
