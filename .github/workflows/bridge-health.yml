name: IA10 Bridge Health Check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check live bridge health
        env:
          HEALTH_URL: https://ia10-renderer-bridge.onrender.com/health
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          url = os.environ["HEALTH_URL"]
          last_error = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read().decode("utf-8")
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}: {body[:500]}")
                  data = json.loads(body)
                  required = ("status", "database_ok", "render_configured", "auth_configured")
                  missing = [key for key in required if key not in data]
                  if missing:
                      raise RuntimeError(f"Health response missing fields: {missing}")
                  if data["status"] != "alive" or data["database_ok"] is not True:
                      raise RuntimeError(f"Bridge unhealthy: {data}")
                  if data["render_configured"] is not True or data["auth_configured"] is not True:
                      raise RuntimeError("Bridge is alive but renderer/auth configuration is incomplete")
                  print("PASS: bridge alive; database reachable; renderer key and bridge auth configured.")
                  print("NOTE: this check does not prove Shotstack accepts a render or that a video passes QC.")
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt + 1}/3 failed: {exc}")
                  if attempt < 2:
                      time.sleep(10)
          sys.exit(f"FAIL: health check did not pass: {last_error}")
          PY
