services:
  - type: web
    name: ia10-renderer-bridge
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SHOTSTACK_API_KEY
        sync: false
      - key: IA10_BRIDGE_TOKEN
        generateValue: true
      - key: SHOTSTACK_API_BASE
        value: https://api.shotstack.io/edit/stage
      - key: DATABASE_URL
        fromDatabase:
          name: ia10-control-queue
          property: connectionString

databases:
  - name: ia10-control-queue
    databaseName: ia10_control_queue
    user: ia10_control_queue_user
    plan: free
    region: frankfurt
